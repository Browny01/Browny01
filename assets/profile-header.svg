<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Brown GitHub profile header</title>
  <desc id="desc">A dark product-style banner for Lucas Brown, full-stack builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09090B"/>
      <stop offset="0.46" stop-color="#111827"/>
      <stop offset="1" stop-color="#052E2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="66" x2="971" y2="325" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.54" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 291C135 232 245 238 348 267C508 312 603 315 743 236C875 162 1015 147 1200 186V360H0V291Z" fill="url(#accent)" opacity="0.12"/>
  <path d="M84 75H1116" stroke="url(#accent)" stroke-width="1.5" opacity="0.42"/>
  <path d="M84 285H1116" stroke="url(#accent)" stroke-width="1.5" opacity="0.20"/>

  <g filter="url(#softShadow)">
    <rect x="760" y="98" width="302" height="174" rx="18" fill="#0F172A" stroke="#334155"/>
    <rect x="785" y="124" width="125" height="12" rx="6" fill="#38BDF8"/>
    <rect x="785" y="154" width="232" height="10" rx="5" fill="#475569"/>
    <rect x="785" y="179" width="186" height="10" rx="5" fill="#334155"/>
    <rect x="785" y="217" width="64" height="28" rx="8" fill="#14B8A6"/>
    <rect x="862" y="217" width="64" height="28" rx="8" fill="#1E293B" stroke="#475569"/>
    <rect x="939" y="217" width="64" height="28" rx="8" fill="#1E293B" stroke="#475569"/>
  </g>

  <g opacity="0.45">
    <circle cx="1016" cy="94" r="5" fill="#A3E635"/>
    <circle cx="1037" cy="94" r="5" fill="#2DD4BF"/>
    <circle cx="1058" cy="94" r="5" fill="#38BDF8"/>
  </g>

  <text x="86" y="145" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="800" letter-spacing="0">Lucas Brown</text>
  <text x="90" y="190" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="500" letter-spacing="0">Full-stack builder working on useful products, live data, and creator tools.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">
    <rect x="88" y="226" width="124" height="42" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="112" y="253" fill="#E2E8F0">React</text>
    <rect x="226" y="226" width="128" height="42" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="250" y="253" fill="#E2E8F0">Next.js</text>
    <rect x="368" y="226" width="154" height="42" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="392" y="253" fill="#E2E8F0">TypeScript</text>
    <rect x="536" y="226" width="128" height="42" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="560" y="253" fill="#E2E8F0">Python</text>
  </g>
</svg>
